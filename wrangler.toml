name = "animate-licence-server"
main = "src/index.ts"
compatibility_date = "2025-05-26"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "animate-licence-db"
database_id = "e2c38144-73ff-4f84-b1b9-4d859db796ec"

[vars]
CREEM_TEST_MODE = "false"
CREEM_DEFAULT_PLAN_ID = "animate-companion-lifetime-basic-v1"
ADMIN_USERNAME = "admin"
CORS_ORIGINS = "http://localhost:1420,http://127.0.0.1:1420,https://tauri.localhost,tauri://localhost"
DEFAULT_APP_VERSION = "0.1.0"
API_HOSTNAMES = "api.licence.getanimate.app"
ADMIN_HOSTNAMES = "admin.licence.getanimate.app"
ACTIVATE_RATE_LIMIT_IP_MAX = "30"
ACTIVATE_RATE_LIMIT_IP_WINDOW_SECONDS = "60"
ACTIVATE_RATE_LIMIT_IP_FAIL_MAX = "15"
ACTIVATE_RATE_LIMIT_IP_FAIL_WINDOW_SECONDS = "300"
ACTIVATE_RATE_LIMIT_ORDER_FAIL_MAX = "8"
ACTIVATE_RATE_LIMIT_ORDER_FAIL_WINDOW_SECONDS = "3600"
TELEMETRY_TOKENS = "animate-desktop-prod-v1-0991ed7c066d949eb026d8c5e40f3230:desktop_prod,animate-desktop-dev:desktop_dev"
TRIAL_ENABLED = "true"
TRIAL_FULL_FEATURE_DURATION_SECONDS = "86400"
TRIAL_TIME_CHECK_TOKEN = "animate-trial-time-check-v1"
# ─── Model catalog (Lever 1, 2026-09-29) ─────────────────────────────────
# Random sample models for trial machines. Objects live in R2; the client
# downloads via presigned URLs. Keep CATALOG_ENABLED=false until models are
# uploaded and verified (scripts/catalog_upload.mjs).
# Region gate decision: mainland China not open yet — country gate only;
# app locale is NOT an exclusion criterion, it only picks content language.
CATALOG_ENABLED = "false"
CATALOG_EXCLUDED_COUNTRIES = "CN"
CATALOG_MAX_GRANTS_PER_MACHINE = "3"
CATALOG_DOWNLOAD_URL_TTL_SECONDS = "900"
# https://{account_id}.r2.cloudflarestorage.com/animate-model-catalog
CATALOG_R2_ENDPOINT = "https://efc49b431fd7c1b183fa8a45e7cbd06b.r2.cloudflarestorage.com/animate-model-catalog"

# Secrets (already set, set via: wrangler secret put <NAME>)
#   ADMIN_PASSWORD
#   SESSION_SECRET
#   RSA_PRIVATE_KEY_PKCS8_HEX
#   CREEM_API_KEY
#   TRIAL_FINGERPRINT_SALT
#   R2_ACCESS_KEY_ID      # read-only R2 API token (Object Read, scoped to animate-model-catalog)
#   R2_SECRET_ACCESS_KEY

# ─── Model catalog storage ────────────────────────────────────────────────
[[r2_buckets]]
binding = "CATALOG"
bucket_name = "animate-model-catalog"
